<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<style>
/* The neutral set; deck.js writes a brand's tokens after these blocks (the marker at the end), from the same names.
   --bar fills the top bar and the cover, --on and --on-muted are text on it, --stripe the line under the bar,
   --page the slide, --title the h2, --detail the marks (question border, bullets). */
:root {
  --bg: #e2dccf; --page: #eee9df; --raised: #e5dfd3; --ink: #2a251f; --muted: #4a433b; --line: #d6cfc2;
  --bar: #4a433b; --on: #fafafa; --on-muted: #e2dccf; --stripe: transparent; --title: #2a251f; --detail: #6a6256;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161514; --page: #201e1c; --raised: #2a2825; --ink: #eeeae4; --muted: #c6c0b7; --line: #2f2c29;
    --bar: #2f2c29; --on: #eeeae4; --on-muted: #c6c0b7; --stripe: transparent; --title: #eeeae4; --detail: #77716a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161514; --page: #201e1c; --raised: #2a2825; --ink: #eeeae4; --muted: #c6c0b7; --line: #2f2c29;
  --bar: #2f2c29; --on: #eeeae4; --on-muted: #c6c0b7; --stripe: transparent; --title: #eeeae4; --detail: #77716a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.35; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

/* A slide is a fixed 16:9 frame: every size inside is in cqi (1% of the slide's width), so its content takes the
   same share of the slide at any width, on a projector as in print. Nothing grows: deck.js measures each slide in
   a browser and fails the build on one whose content does not fit, so the clip below never cuts anything. */
.deck {
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  max-width: 1280px; margin-inline: auto; padding-inline: var(--gutter);
  padding-block: 32px 88px; display: grid; gap: 32px; container-type: inline-size;
}
@media (min-width: 701px) {
  .deck {
    --centre: calc((100vh - (min(1280px, 100%) - 2 * var(--gutter)) * 9 / 16) / 2);
    padding-block: max(32px, var(--centre)) max(88px, var(--centre));
  }
}
.slide {
  aspect-ratio: 16 / 9; overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr);
  font-size: 2.1cqi; background: var(--page); border-radius: 12px; scroll-snap-align: center;
  box-shadow: 0 1px 3px rgb(0 0 0 / .12);
}
.bar {
  position: relative; display: flex; align-items: center; gap: 2.4cqi; height: 6.4cqi; padding-inline: 4.5cqi;
  background: var(--bar); color: var(--on);
}
.bar::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: .5cqi; background: var(--stripe); }
.logo { height: 2.6cqi; width: auto; max-width: 22cqi; object-fit: contain; flex: none; }
span.logo { display: block; background: var(--logo) left center / contain no-repeat; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
.name { font-size: 1.9cqi; font-weight: 700; flex: none; }
.eyebrow {
  min-width: 0; padding-left: 2.4cqi; border-left: 1px solid var(--on-muted); color: var(--on-muted);
  font-size: 1.6cqi; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.eyebrow:empty { display: none; }
.num { margin-left: auto; font-family: var(--mono); font-size: 1.4cqi; color: var(--on-muted); flex: none; }
.body { min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 1.6cqi; padding: 3cqi 4.5cqi 3.2cqi; }
.body > * { margin: 0; }
.slide h2 { font-size: 3.5cqi; line-height: 1.15; color: var(--title); max-width: 34em; text-wrap: balance; }
.slide p, .slide li { max-width: 46em; }
.slide ul, .slide ol { padding-left: 2.6cqi; display: grid; align-content: start; gap: .8cqi; }
.slide li::marker { color: var(--detail); }
.slide strong { color: var(--title); }

/* A diagram or image takes the room the text leaves, scaled to fit it whole. */
.visual { flex: 1 1 0; min-height: 10cqi; position: relative; margin: 0; }
.visual > img, .visual > svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.visual figcaption { position: absolute; left: 0; right: 0; bottom: 0; font-size: 1.5cqi; color: var(--muted); }
/* Side by side: text on one side, a diagram or questions on the other. */
.cols { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 3cqi; }
.cols > * { min-height: 0; display: flex; flex-direction: column; gap: 1.4cqi; margin: 0; }
.ticket { font-family: var(--mono); font-size: .85em; color: var(--muted); white-space: nowrap; }

.question {
  padding: 1.1cqi 1.8cqi; border-left: .6cqi solid var(--detail); background: var(--raised); border-radius: 0 8px 8px 0;
}
.question p { margin: 0; }
.q-label { display: block; font-size: 1.3cqi; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: .4cqi; }
.question.answered { border-left-color: var(--line); }
.q-answer { margin: .8cqi 0 0; font-weight: 600; }

.cover { background: var(--bar); color: var(--on); }
.cover .bar { height: 11cqi; }
.cover .logo { height: 4.4cqi; max-width: 40cqi; }
.cover .name { font-size: 3cqi; }
.cover .body { justify-content: center; gap: 2.2cqi; padding-bottom: 6cqi; }
.cover h2 { font-size: 5cqi; color: var(--on); }
.cover p { color: var(--on-muted); font-size: 2.3cqi; }
.cover strong { color: var(--on); }

.recap ol { gap: 1.4cqi; }
.recap li > div > p { margin: 0; }
.recap .from { margin: .3cqi 0 0; font-size: 1.5cqi; color: var(--muted); }
.recap a { color: inherit; text-underline-offset: .25em; }

:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.slide:focus { outline: none; }
.slide:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

/* A phone reads the deck as cards that grow; the fit is measured, and kept, above this width. */
@media (max-width: 700px) {
  .slide { aspect-ratio: auto; overflow: visible; font-size: 15px; }
  .bar { height: auto; min-height: 44px; padding: 8px 16px; gap: 12px; }
  .logo { height: 20px; }
  .name, .eyebrow { font-size: 13px; }
  .num { font-size: 12px; }
  .body { padding: 16px; gap: 12px; }
  .slide h2 { font-size: 22px; }
  .cover h2 { font-size: 28px; }
  .cover p { font-size: 16px; }
  .visual { flex: none; aspect-ratio: 16 / 10; }
  .cols { grid-template-columns: 1fr; }
  .q-label, .recap .from { font-size: 12px; }
}

/* Toolbar */
.toolbar {
  position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px));
  display: flex; gap: 8px;
}
.toolbar[hidden] { display: none; }
.toolbar button {
  min-width: 44px; min-height: 44px; padding: 0 16px; font: inherit; color: var(--ink);
  background: var(--page); border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
}

/* Print: one slide per 13.333 × 7.5 in page, the same layout as on screen (the deck is the page's width, so cqi
   keeps every share), in the light theme. */
@media print {
  @page { size: 13.333in 7.5in; margin: 0 }
  :root:root:root {
    --bg: #e2dccf; --page: #eee9df; --raised: #e5dfd3; --ink: #2a251f; --muted: #4a433b; --line: #d6cfc2;
    --bar: #4a433b; --on: #fafafa; --on-muted: #e2dccf; --stripe: transparent; --title: #2a251f; --detail: #6a6256;
    color-scheme: light;
  }
  body { background: var(--page); }
  .deck { display: block; width: 13.333in; max-width: none; padding: 0; }
  .slide {
    width: 13.333in; height: 7.5in; aspect-ratio: auto; break-after: page; border-radius: 0; box-shadow: none;
    print-color-adjust: exact; -webkit-print-color-adjust: exact;
  }
  .toolbar { display: none !important; }
}
/*BRAND*/
</style>
</head>
<body>
<main class="deck" id="deck">
<!--SLIDES-->
</main>
<div class="toolbar" id="toolbar" hidden>
  <button type="button" id="theme-btn"></button>
</div>
<script type="application/json" id="copy">__COPY__</script>
<script>
(function () {
  var root = document.documentElement;
  var copy = {};
  try { copy = JSON.parse(document.getElementById('copy').textContent) || {}; } catch (e) { copy = {}; }
  function say(k) { return copy[k] || ''; }
  function $(id) { return document.getElementById(id); }
  var cards = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var total = cards.length;
  var cur = 0, lastWalk = 0;

  function readTheme() {
    try { return localStorage.getItem('team-deck-theme'); } catch (e) { return null; }
  }
  function writeTheme(v) {
    try { localStorage.setItem('team-deck-theme', v); } catch (e) { return; }
  }
  function isDark() {
    var t = root.getAttribute('data-theme');
    if (t) return t === 'dark';
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function paintTheme() { $('theme-btn').textContent = say(isDark() ? 'themeToLight' : 'themeToDark'); }
  var stored = readTheme();
  if (stored === 'dark' || stored === 'light') root.setAttribute('data-theme', stored);
  $('theme-btn').addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    writeTheme(next);
    paintTheme();
  });

  function nearest() {
    var mid = (window.innerHeight || 0) / 2, best = 0, bestD = Infinity;
    cards.forEach(function (c, i) {
      var r = c.getBoundingClientRect(), d = Math.abs(r.top + r.height / 2 - mid);
      if (d < bestD) { bestD = d; best = i; }
    });
    return best;
  }
  function index() {
    if (Date.now() - lastWalk < 800) return cur;
    return nearest();
  }
  function go(i) {
    if (!total) return;
    cur = Math.max(0, Math.min(total - 1, i));
    lastWalk = Date.now();
    var c = cards[cur];
    c.scrollIntoView({ block: 'center' });
    c.focus({ preventScroll: true });
  }
  paintTheme();

  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
    var tag = e.target && e.target.tagName ? String(e.target.tagName).toLowerCase() : '';
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    var k = e.key, dir = 0, jump = null;
    if (k === ' ' || k === 'Spacebar') { if (tag === 'button' || tag === 'a') return; dir = 1; }
    else if (k === 'ArrowDown' || k === 'PageDown') dir = 1;
    else if (k === 'ArrowUp' || k === 'PageUp') dir = -1;
    else if (k === 'ArrowRight') jump = 1;
    else if (k === 'ArrowLeft') jump = -1;
    else if (k === 'Home') { e.preventDefault(); go(0); return; }
    else if (k === 'End') { e.preventDefault(); go(total - 1); return; }
    else return;
    e.preventDefault();
    go(index() + (jump || dir));
  });

  $('toolbar').hidden = false;
})();
</script>
</body>
</html>
